<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سياسة الخصوصية - ذكّرني (Zakkerni)</title>
<style>
  :root {
    --primary: #4F5FD9;
    --primary-dark: #3B49B8;
    --bg: #F5F6FB;
    --surface: #FFFFFF;
    --text: #1C1D2E;
    --text-muted: #5A5C74;
    --border: #E3E4F0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0F1A;
      --surface: #171827;
      --text: #EDEDF7;
      --text-muted: #A6A8C4;
      --border: #2A2C42;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0F1A;
    --surface: #171827;
    --text: #EDEDF7;
    --text-muted: #A6A8C4;
    --border: #2A2C42;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.8;
  }
  .topbar {
    position: sticky;
    top: 0;
    padding-top: env(safe-area-inset-top, 0px);
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff;
    z-index: 10;
  }
  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
  .brand .icon { font-size: 1.4rem; }
  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 3px;
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-toggle button.active { background: #fff; color: var(--primary-dark); font-weight: 700; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  h1.page-title { font-size: 1.4rem; margin: 0 0 4px; }
  .updated { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
  section.policy-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  section.policy-card h2 {
    font-size: 1.05rem;
    margin: 0 0 8px;
    color: var(--primary);
  }
  section.policy-card p { margin: 0; color: var(--text); white-space: pre-line; font-size: 0.95rem; }
  a { color: var(--primary); }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 30px;
  }
  [dir="ltr"] body { direction: ltr; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="icon">🔒</span><span id="brandTitle">ذكّرني - سياسة الخصوصية</span></div>
      <div class="lang-toggle">
        <button id="btnAr" class="active" onclick="setLang('ar')">عربي</button>
        <button id="btnEn" onclick="setLang('en')">English</button>
      </div>
    </div>
  </div>
  <main>
    <h1 class="page-title" id="pageTitle">سياسة خصوصية تطبيق ذكّرني (Zakkerni)</h1>

  </main>

function render(lang) {
  const d = data[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = d.dir;
  document.title = d.brand;
  document.getElementById('brandTitle').textContent = d.brand;
  document.getElementById('pageTitle').textContent = d.title;
  document.getElementById('updated').textContent = d.updated;
  document.getElementById('footerNote').textContent = d.footer;
  const content = document.getElementById('content');
  content.innerHTML = '';
  d.sections.forEach(([h, body]) => {
    const sec = document.createElement('section');
    sec.className = 'policy-card';
    const h2 = document.createElement('h2');
    h2.textContent = h;
    const p = document.createElement('p');
    p.textContent = body;
    sec.appendChild(h2);
    sec.appendChild(p);
    content.appendChild(sec);
  });
  document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  try { localStorage.setItem('zakkerni_privacy_lang', lang); } catch (e) {}
}

function setLang(lang) { render(lang); }

let initialLang = 'ar';
try {
  const saved = localStorage.getItem('zakkerni_privacy_lang');
  if (saved === 'en' || saved === 'ar') initialLang = saved;
} catch (e) {}
render(initialLang);
</script>
</body>
</html>
